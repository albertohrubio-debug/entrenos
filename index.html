<script>/* Cuaderno de Entrenos · motor de análisis, planificación y FIT (versión navegador).
   Traducción de analysis.py, planificador.py y fit_workout.py. */
(function (raiz) {
"use strict";

/* ======================================================================== ANÁLISIS */
const GRUPOS = {
  bici: ["Ride", "VirtualRide", "GravelRide", "MountainBikeRide", "EBikeRide", "EMountainBikeRide", "Velomobile", "Handcycle"],
  carrera: ["Run", "VirtualRun"], trail: ["TrailRun"],
  montana: ["Hike", "Snowshoe", "BackcountrySki", "RockClimbing", "Mountaineering", "Climbing", "IceClimbing"],
};
const DURACIONES = [1, 5, 10, 15, 30, 60, 120, 180, 300, 480, 600, 1200, 1800, 2700, 3600, 5400, 7200, 10800];
const ALTITUDES = [1500, 2000, 2500, 3000, 3500, 4000, 4500];
const VENTANAS_VERTICAL = [600, 1800, 3600];
const TSS_HORA_DEFECTO = { bici: 50, carrera: 60, trail: 65, montana: 45, otros: 35 };
const AJUSTES_DEFECTO = { ftp: 250, peso: 72.0, fc_max: 185, fc_reposo: 50, lthr: 168, ritmo_umbral: 270, ftp_carrera: 0, sexo: "H" };

function grupoDeporte(t) { for (const g in GRUPOS) if (GRUPOS[g].includes(t)) return g; return "otros"; }
const r0 = (v, nd = 1) => (v == null || !isFinite(v)) ? null : Math.round(v * 10 ** nd) / 10 ** nd;
const arr = x => x == null ? null : Float64Array.from(x, v => v == null ? 0 : +v || 0);
const suma = a => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; return s; };
const media = a => a.length ? suma(a) / a.length : 0;
const maxA = a => { let m = -Infinity; for (let i = 0; i < a.length; i++) if (a[i] > m) m = a[i]; return m; };
const minA = a => { let m = Infinity; for (let i = 0; i < a.length; i++) if (a[i] < m) m = a[i]; return m; };

function a1hz(time, series, moving, maxHueco = 5) {
  const n = time.length, dt = new Int32Array(n);
  for (let i = 0; i < n; i++) {
    let d = i === 0 ? 1 : Math.round(time[i] - time[i - 1]);
    d = Math.max(0, Math.min(maxHueco, d));
    if (moving && moving.length === n && !moving[i]) d = 0;
    dt[i] = d;
  }
  const total = suma(dt), out = {};
  for (const k in series) {
    const v = series[k];
    if (!v) { out[k] = null; continue; }
    const o = new Float64Array(total); let p = 0;
    for (let i = 0; i < n; i++) for (let j = 0; j < dt[i]; j++) o[p++] = v[i];
    out[k] = o;
  }
  return out;
}
function cums(x) { const c = new Float64Array(x.length + 1); for (let i = 0; i < x.length; i++) c[i + 1] = c[i] + x[i]; return c; }
function mediaMovil(x, n) {
  if (n <= 1) return Float64Array.from(x);
  if (x.length < n) return x.length ? Float64Array.of(media(x)) : x;
  const c = cums(x), o = new Float64Array(x.length - n + 1);
  for (let i = 0; i < o.length; i++) o[i] = (c[i + n] - c[i]) / n;
  return o;
}
function mediaMovilCentrada(x, n) {
  if (x.length < n) return Float64Array.from(x);
  const pad = Math.floor(n / 2), L = x.length, xp = new Float64Array(L + n - 1);
  for (let i = 0; i < xp.length; i++) xp[i] = x[Math.min(L - 1, Math.max(0, i - pad))];
  const c = cums(xp), o = new Float64Array(L);
  for (let i = 0; i < L; i++) o[i] = (c[i + n] - c[i]) / n;
  return o;
}
function mejoresMedias(x, dur = DURACIONES) {
  const n = x.length; if (!n) return dur.map(() => null);
  const c = cums(x);
  return dur.map(d => {
    if (d > n) return null;
    let m = -Infinity; for (let i = d; i <= n; i++) { const v = c[i] - c[i - d]; if (v > m) m = v; }
    return r0(m / d, 1);
  });
}
function potNormalizada(w) {
  if (!w.length) return 0;
  if (w.length < 30) return media(w);
  const r = mediaMovil(w, 30); let s = 0; for (const v of r) s += v ** 4;
  return (s / r.length) ** 0.25;
}
function tiempoEnZonas(x, lim) {
  const z = new Array(lim.length + 1).fill(0);
  if (!x) return z;
  for (const v of x) { let k = 0; while (k < lim.length && v >= lim[k]) k++; z[k]++; }
  return z;
}
const minetti = g => { g = Math.max(-0.45, Math.min(0.45, g)); return 155.4 * g ** 5 - 30.4 * g ** 4 - 43.3 * g ** 3 + 46.3 * g ** 2 + 19.5 * g + 3.6; };
function gradiente(x) {
  const n = x.length, o = new Float64Array(n);
  if (n < 2) return o;
  o[0] = x[1] - x[0]; o[n - 1] = x[n - 1] - x[n - 2];
  for (let i = 1; i < n - 1; i++) o[i] = (x[i + 1] - x[i - 1]) / 2;
  return o;
}

function analizar(act, streams, ajIn) {
  const aj = { ...AJUSTES_DEFECTO, ...(ajIn || {}) };
  const grupo = grupoDeporte(act.sport_type || act.type);
  const m = { grupo };
  const horas = (act.moving_time || 0) / 3600;
  const s = streams || {};
  if (!s.time || s.time.length < 10) return sinStreams(act, aj, grupo, m);

  const moving = s.moving ? s.moving.map(Boolean) : null;
  const r = a1hz(s.time, { hr: arr(s.heartrate), w: arr(s.watts), alt: arr(s.altitude), v: arr(s.velocity_smooth), d: arr(s.distance), g: arr(s.grade_smooth) }, moving);
  const seg = (r.v || Object.values(r).find(a => a) || []).length;
  m.segundos_analizados = seg;
  const h1 = seg ? seg / 3600 : horas;

  // Potencia
  const w = r.w;
  const tienePot = !!(w && w.length && maxA(w) > 0 && act.device_watts !== false);
  const ftp = grupo === "bici" ? aj.ftp : (aj.ftp_carrera || 0);
  if (tienePot) {
    const np = potNormalizada(w), avg = media(w);
    m.potencia_media = r0(avg, 0); m.np = r0(np, 0);
    m.vi = avg > 0 ? r0(np / avg, 2) : null;
    m.kj = r0(suma(w) / 1000, 0);
    m.curva_potencia = mejoresMedias(w);
    m.w_kg = aj.peso ? r0(np / aj.peso, 2) : null;
    if (ftp) {

      m.if = r0(f, 2); m.tss_potencia = r0(h1 * f * f * 100, 0);
      m.zonas_potencia = tiempoEnZonas(w, [.55, .75, .90, 1.05, 1.20, 1.50].map(p => ftp * p));
    }
    const p20 = m.curva_potencia[DURACIONES.indexOf(1200)];
    m.eftp = p20 ? r0(p20 * 0.95, 0) : null;
  }
  // FC
  const hr = r.hr;
  if (hr && hr.length && maxA(hr) > 0) {
    const hrv = hr.filter(v => v > 0);
    m.fc_media = r0(media(hrv), 0); m.fc_max = r0(maxA(hrv), 0);
    const lthr = aj.lthr || 0;
    const lim = lthr ? [.81, .90, .94, 1.0].map(p => lthr * p) : [.6, .7, .8, .9].map(p => aj.fc_max * p);
    m.zonas_fc = tiempoEnZonas(hrv, lim);
    const rest = aj.fc_reposo, mx = aj.fc_max, k = aj.sexo === "M" ? 1.67 : 1.92;
    let trimp = 0;
    for (const v of hrv) { const x = Math.max(0, Math.min(1, (v - rest) / Math.max(mx - rest, 1))); trimp += x * 0.64 * Math.exp(k * x); }
    trimp /= 60; m.trimp = r0(trimp, 0);
    if (lthr) { const xl = (lthr - rest) / Math.max(mx - rest, 1); m.tss_fc = r0(trimp / (60 * xl * 0.64 * Math.exp(k * xl)) * 100, 0); }
  }
  // Velocidad / GAP
  const v = r.v; let g = null, vaj = null;
  if (v && v.length && maxA(v) > 0) {
    if (r.g) g = r.g.map(x => x / 100);
    else if (r.alt && r.d) {
      const as = mediaMovilCentrada(r.alt, 15), dd = gradiente(r.d), da = gradiente(as);
      g = dd.map((x, i) => x > 0.5 ? da[i] / Math.max(x, 0.5) : 0);
    } else g = new Float64Array(v.length);
    g = mediaMovilCentrada(g.map(x => Math.max(-0.45, Math.min(0.45, x))), 5);
    if (["carrera", "trail", "montana"].includes(grupo)) {
      vaj = v.map((x, i) => x * minetti(g[i]) / 3.6);
      const ngp = media(vaj), mv = media(v);
      m.ngp = r0(ngp, 3);
      m.ritmo = mv > 0 ? r0(1000 / mv, 0) : null;
      m.gap = ngp > 0 ? r0(1000 / ngp, 0) : null;
      const ru = aj.ritmo_umbral || 0;
      if (ru && (grupo === "carrera" || grupo === "trail")) {
        const rif = ngp / (1000 / ru);
        m.if_ritmo = r0(rif, 2); m.tss_ritmo = r0(h1 * rif * rif * 100, 0);
      }
      m.mejores_ritmos_gap = mejoresMedias(vaj, [60, 300, 600, 1200, 1800, 3600]).map(x => x ? r0(1000 / x, 0) : null);
    }
  }
  // Montaña
  const alt = r.alt;
  if (alt && alt.length > 60) {
    const as = mediaMovilCentrada(alt, 31);
    const da = as.map((x, i) => i ? x - as[i - 1] : 0);
    let sub = 0, baj = 0; for (const x of da) { if (x > 0) sub += x; else baj -= x; }
    const vv = mediaMovilCentrada(da, 60);
    let tSub = 0, gSub = 0;
    for (let i = 0; i < vv.length; i++) if (vv[i] > 0.05) { tSub++; if (da[i] > 0) gSub += da[i]; }
    m.desnivel_pos = r0(sub, 0); m.desnivel_neg = r0(baj, 0);
    m.alt_max = r0(maxA(alt), 0); m.alt_min = r0(minA(alt), 0);
    m.tiempo_subiendo = tSub;
    if (tSub > 120) m.vam = r0(gSub / (tSub / 3600), 0);
    m.max_ascenso_ventanas = VENTANAS_VERTICAL.map(vent => {
      if (as.length <= vent) return null;
      let mm = -Infinity; for (let i = vent; i < as.length; i++) { const d = as[i] - as[i - vent]; if (d > mm) mm = d; }
      return r0(mm, 0);
    });
    m.tiempo_altitud = ALTITUDES.map(a => { let c = 0; for (const x of alt) if (x >= a) c++; return c; });
  }
  // Desacople y eficiencia
  if (hr && seg >= 1200 && maxA(hr) > 0) {
    const mitad = Math.floor(seg / 2);
    let base = null;
    if (tienePot) base = w;
    else if (v && (grupo === "carrera" || grupo === "trail") && m.ngp != null) base = vaj;
    if (base) {
      const h_1 = media(hr.subarray(0, mitad)), h_2 = media(hr.subarray(mitad));
      if (h_1 > 0 && h_2 > 0) {
        const ef1 = media(base.subarray(0, mitad)) / h_1, ef2 = media(base.subarray(mitad)) / h_2;
        if (ef1 > 0) m.desacople = r0((ef1 - ef2) / ef1 * 100, 1);
      }
      if (m.fc_media > 0) m.ef = tienePot ? r0(m.np / m.fc_media, 2) : r0(media(base) * 60 / m.fc_media, 2);
    }
  }
  elegirTss(m, grupo, h1);
  return m;
}
function elegirTss(m, grupo, h) {
  if (m.tss_potencia != null) { m.tss = m.tss_potencia; m.tss_fuente = "potencia"; }
  else if (m.tss_ritmo != null) { m.tss = m.tss_ritmo; m.tss_fuente = "ritmo"; }
  else if (m.tss_fc != null) { m.tss = m.tss_fc; m.tss_fuente = "fc"; }
  else { m.tss = r0(h * (TSS_HORA_DEFECTO[grupo] || 35), 0); m.tss_fuente = "estimado"; }
}
function sinStreams(act, aj, grupo, m) {
  const h = (act.moving_time || 0) / 3600, nw = act.weighted_average_watts;
  const ftp = grupo === "bici" ? aj.ftp : (aj.ftp_carrera || 0);
  if (nw && ftp && act.device_watts) { const f = nw / ftp; m.np = nw; m.if = r0(f, 2); m.tss_potencia = r0(h * f * f * 100, 0); }
  if (act.average_heartrate) m.fc_media = r0(act.average_heartrate, 0);
  m.desnivel_pos = act.total_elevation_gain; m.alt_max = act.elev_high;

function streamsCompactos(st, n = 400, maxRuta = 600) {
  if (!st || !st.time || st.time.length < 10) return null;
  const L = st.time.length; n = Math.min(n, L);
  const b = Array.from({ length: n + 1 }, (_, i) => Math.floor(i * L / n));
  const claves = { time: "t", distance: "d", altitude: "alt", watts: "w", heartrate: "hr", velocity_smooth: "v", cadence: "cad", grade_smooth: "g" };
  const out = {};
  for (const k in claves) {
    const x = st[k]; if (!x) continue;
    const red = [];
    for (let i = 0; i < n; i++) { let s = 0; for (let j = b[i]; j < b[i + 1]; j++) s += +x[j] || 0; red.push(s / Math.max(1, b[i + 1] - b[i])); }
    let nd = ["watts", "heartrate", "cadence", "time"].includes(k) ? 0 : 1;
    let vals = red;
    if (k === "distance") { vals = red.map(v => v / 1000); nd = 3; }
    if (k === "velocity_smooth") nd = 2;
    out[claves[k]] = vals.map(v => r0(v, nd));
  }
  const ll = st.latlng;
  if (ll && ll.length) {
    const paso = Math.max(1, Math.floor(ll.length / maxRuta));
    const ruta = [];
    for (let i = 0; i < ll.length; i += paso) if (ll[i]) ruta.push([r0(ll[i][0], 5), r0(ll[i][1], 5)]);
    const u = ll[ll.length - 1]; if (u) ruta.push([r0(u[0], 5), r0(u[1], 5)]);
    out.ruta = ruta;
  }
  return out;
}

/* ======================================================================== PLANIFICADOR */
const DIAS = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];
const CONFIG_DEFECTO = {
  deportes: ["bici", "carrera", "trail", "montana", "fuerza"],
  dias: [{ deporte: "descanso", horas: 0 }, { deporte: "rodillo", horas: 1.25 }, { deporte: "bici", horas: 1.5 }, { deporte: "carrera", horas: 1.0 },
         { deporte: "fuerza", horas: 0.75 }, { deporte: "bici", horas: 3.5 }, { deporte: "montana", horas: 5.0 }],
  ctl_minimo: 35, rampa: [3, 4, 5],
};
const RAMPA_MAX_TSB = -25;
const pct = (a, b) => [Math.round(a * 100), Math.round(b * 100)];
const pot = (aj, a, b) => ({ tipo: "potencia", bajo: Math.round(aj.ftp * a), alto: Math.round(aj.ftp * b), pct: pct(a, b) });
const ritmo = (aj, a, b) => { const v = 1000 / aj.ritmo_umbral; return { tipo: "ritmo", lento: Math.round(1000 / (v * a)), rapido: Math.round(1000 / (v * b)), pct: pct(a, b) }; };
const fc = (aj, a, b) => { const lt = aj.lthr || Math.round(aj.fc_max * 0.9); return { tipo: "fc", bajo: Math.round(lt * a), alto: Math.round(lt * b), pct: pct(a, b) }; };
const paso = (tipo, min, objetivo = null, nota = "") => ({ tipo, dur: Math.round(min * 60), objetivo, nota });

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fl = Math.floor;
const red10 = x => Math.round(x / 10) * 10;

const B = {
  recuperacion: (aj, m) => ["Recuperación activa", "Pedaleo muy suave, cadencia alta (90-100 rpm). Sin forzar.",
    [paso("calentamiento", 10, pot(aj, .45, .55)), paso("activo", Math.max(m - 15, 10), pot(aj, .50, .58)), paso("enfriamiento", 5, pot(aj, .40, .50))], {}],
  resistencia: (aj, m) => ["Resistencia Z2", "Base aeróbica. Mantén la potencia estable y la conversación fluida.",
    [paso("calentamiento", 10, pot(aj, .50, .62)), paso("activo", Math.max(m - 20, 15), pot(aj, .65, .75)), paso("enfriamiento", 10, pot(aj, .45, .55))], {}],
  tempo: (aj, m) => { const n = clamp(fl((m - 25) / 20), 2, 4), resto = Math.max(m - 25 - n * 20, 0);
    const p = [paso("calentamiento", 15, pot(aj, .50, .70)), repetir(n, paso("activo", 15, pot(aj, .80, .88), "Tempo"), paso("recuperacion", 5, pot(aj, .55, .62)))];
    if (resto >= 5) p.push(paso("activo", resto, pot(aj, .65, .75), "Z2")); p.push(paso("enfriamiento", 10, pot(aj, .45, .55)));
    return [`Tempo ${n}×15 min`, "Ritmo sostenido incómodo pero controlado, 85-95 rpm.", p, {}]; },
  sweetspot: (aj, m) => { const n = clamp(fl((m - 25) / 16), 2, 5), resto = Math.max(m - 25 - n * 16, 0);
    const p = [paso("calentamiento", 15, pot(aj, .50, .72)), repetir(n, paso("activo", 12, pot(aj, .88, .94), "Sweet spot"), paso("recuperacion", 4, pot(aj, .50, .60)))];
    if (resto >= 5) p.push(paso("activo", resto, pot(aj, .65, .75), "Z2")); p.push(paso("enfriamiento", 10, pot(aj, .45, .55)));
    return [`Sweet spot ${n}×12 min`, "El trabajo con mejor relación carga/beneficio para subir el FTP.", p, {}]; },
  umbral: (aj, m) => { const n = clamp(fl((m - 25) / 12), 3, 6), resto = Math.max(m - 25 - n * 12, 0);
    const p = [paso("calentamiento", 12, pot(aj, .50, .70)), repetir(3, paso("activo", 1, pot(aj, 1.0, 1.1), "Activación"), paso("recuperacion", 1, pot(aj, .50, .60))),
      repetir(n, paso("activo", 8, pot(aj, .95, 1.03), "Umbral"), paso("recuperacion", 4, pot(aj, .50, .60)))];
    if (resto >= 5) p.push(paso("activo", resto, pot(aj, .62, .72), "Z2")); p.push(paso("enfriamiento", 8, pot(aj, .45, .55)));
    return [`Umbral ${n}×8 min`, "Intervalos en tu FTP. Regulares: el último igual que el primero.", p, {}]; },
  vo2: (aj, m) => { const n = clamp(fl((m - 30) / 8), 4, 6), resto = Math.max(m - 30 - n * 8, 0);
    const p = [paso("calentamiento", 15, pot(aj, .50, .72)), repetir(n, paso("activo", 4, pot(aj, 1.08, 1.18), "VO2máx"), paso("recuperacion", 4, pot(aj, .45, .55)))];
    if (resto >= 5) p.push(paso("activo", resto, pot(aj, .62, .72), "Z2")); p.push(paso("enfriamiento", 15, pot(aj, .45, .55)));
    return [`VO2máx ${n}×4 min`, "Muy duro. Cadencia alta (95-105 rpm). Si no llegas al rango en la última, para.", p, {}]; },
  larga: (aj, m) => { const p = [paso("calentamiento", 15, pot(aj, .50, .65))], cuerpo = Math.max(m - 25, 30); let nombre;
    if (cuerpo >= 100) { const bl = cuerpo < 180 ? 2 : 3, z2 = (cuerpo - bl * 20) / (bl + 1);

    } else { p.push(paso("activo", cuerpo, pot(aj, .62, .74), "Z2")); nombre = "Fondo Z2"; }
    p.push(paso("enfriamiento", 10, pot(aj, .45, .55)));
    return [nombre, "Salida larga. Come cada 30-40 min y bebe a menudo. Subidas sin pasar de umbral.", p, {}]; },
};
const C = {
  suave: (aj, m) => ["Rodaje suave", "Z2. Debes poder hablar. Termina con 4 progresiones de 20 s si te sientes bien.",
    [paso("calentamiento", 10, ritmo(aj, .70, .78)), paso("activo", Math.max(m - 15, 15), ritmo(aj, .76, .86)), paso("enfriamiento", 5, ritmo(aj, .65, .75))], {}],

  umbral: (aj, m) => { const n = clamp(fl((m - 25) / 8), 3, 6); return [`Umbral ${n}×6 min`, "Ritmo de umbral (aprox. ritmo de carrera de 1 hora). Recuperación trotando.",
    [paso("calentamiento", 15, ritmo(aj, .70, .80)), repetir(n, paso("activo", 6, ritmo(aj, .97, 1.02), "Umbral"), paso("recuperacion", 2, ritmo(aj, .65, .75))), paso("enfriamiento", 10, ritmo(aj, .65, .75))], {}]; },
  vo2: (aj, m) => { const n = clamp(fl((m - 25) / 5.5), 4, 7); return [`Series ${n}×3 min`, "Ritmo de 5 km aprox. Recupera trotando 2:30.",

document.addEventListener("click", async ev => {

const seg = (id, ops, val) => `<div class="seg" id="${id}" role="group">${ops.map(([k, t]) => `<button type="button" data-v="${k}" aria-pressed="${k == val}">${t}</button>`).join("")}</div>`;
function onSeg(id, fn) {
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    fn(b.dataset.v);
  });
}
function filaAct(a) {
  const g = grupo(a), m = a.m || {};
  let int = "–";
  if (m.np) int = `${m.np} W${m.if ? ` · IF ${n2(m.if)}` : ""}`;
  else if (m.gap && (g === "carrera" || g === "trail")) int = `GAP ${fRitmo(m.gap)}/km`;
  else if (m.vam) int = `VAM ${n0(m.vam)} m/h`;
  return `<tr class="clic" data-id="${a.id}" tabindex="0">
    <td>${fFechaC(a.start_date_local)}</td><td class="nom">${esc(a.name)}</td><td>${chip(g)}</td>
    <td class="n">${fT(a.moving_time)}</td><td class="n">${fKm(a.distance)}</td><td class="n">${n0(desn(a))}</td>
    <td class="n">${n0(m.tss)}<span class="fuente">${m.tss_fuente ? m.tss_fuente.slice(0, 3) : ""}</span></td>
    <td class="n">${int}</td><td class="n">${n0(m.fc_media)}</td></tr>`;
}
const cabTabla = `<thead><tr><th>Fecha</th><th>Nombre</th><th>Deporte</th><th class="n">Tiempo</th><th class="n">km</th><th class="n">Desnivel</th><th class="n">TSS</th><th class="n">Intensidad</th><th class="n">FC</th></tr></thead>`;
function clicFilas(root) {
  root.addEventListener("click", e => { const tr = e.target.closest("tr[data-id]"); if (tr) location.hash = "#act-" + tr.dataset.id; });
  root.addEventListener("keydown", e => { if (e.key === "Enter") { const tr = e.target.closest("tr[data-id]"); if (tr) location.hash = "#act-" + tr.dataset.id; } });
}
function zonasHTML(seg, nombres, colores) {
  const tot = seg.reduce((a, b) => a + b, 0) || 1;
  return `<div class="zonas">${seg.map((s, i) => `<div class="zona"><span>${nombres[i]}</span><span class="barra"><i style="width:${(s / tot * 100).toFixed(1)}%;background:${colores[i]}"></i></span><span class="num" style="text-align:right">${fH(s).replace("0h ", "")} <span class="nota">${Math.round(s / tot * 100)}%</span></span></div>`).join("")}</div>`;
}
const coloresZP = () => ["--otros", "--bici", "--trail", "--aviso", "--carrera", "--mal", "--montana"].map(tok);
const coloresZF = () => ["--otros", "--bici", "--trail", "--aviso", "--mal"].map(tok);

/* ------------------------------------------------------------ RESUMEN */
function vResumen() {
  const el = $("#v-resumen"), A = S.acts, aj = S.ajustes;

  const n = p.ctl.length - 1;
  const ctl = n >= 0 ? p.ctl[n] : 0, atl = n >= 0 ? p.atl[n] : 0, tsb = +(ctl - atl).toFixed(1);
  const rampa = n >= 7 ? +(ctl - p.ctl[0]).toFixed(1) : null;
  const [cls, txt] = estadoForma(tsb);
  const ef = eftp(A, 42);
  const sem = lunes(hoyKey());
  const delaSemana = A.filter(a => dia(a.start_date_local) >= sem);
  const d28 = diasAtras(28);
  const reparto = {};
  for (const a of A) if (dia(a.start_date_local) >= d28) { const g = grupo(a); reparto[g] = (reparto[g] || 0) + (a.moving_time || 0); }
  const totRep = Object.values(reparto).reduce((a, b) => a + b, 0) || 1;
  el.innerHTML = `
  <div id="hoy-toca"></div>
  <div class="kpis">
    ${kpi("Forma física (CTL)", n0(ctl), "", rampa != null ? `${rampa >= 0 ? "+" : ""}${n1(rampa)} en 7 días` : "")}
    ${kpi("Fatiga (ATL)", n0(atl), "", "media de 7 días")}
    ${kpi("Frescura (TSB)", (tsb > 0 ? "+" : "") + n0(tsb), "", `<span class="pill ${cls}">${txt}</span>`)}
    ${kpi("FTP estimado", ef ? n0(ef) : "–", ef ? " W" : "", ef && aj.peso ? `${n2(ef / aj.peso)} W/kg · configurado ${n0(aj.ftp)} W` : "sin potencia en 6 semanas")}
    ${kpi("Esta semana", fH(delaSemana.reduce((s, a) => s + (a.moving_time || 0), 0)), "", `${n0(delaSemana.reduce((s, a) => s + (a.m?.tss || 0), 0))} TSS · ${n0(delaSemana.reduce((s, a) => s + desn(a), 0))} m+`)}
  </div>
  <div class="panel">
    <header><h3>Carga y forma</h3><div class="filtros">${seg("pmc-g", [["todos", "Todo"], ["bici", "Bici"], ["pie", "Carrera y trail"], ["montana", "Montaña"]], S.pmc.grupo)}${seg("pmc-d", [[90, "3 meses"], [180, "6 meses"], [365, "1 año"]], S.pmc.dias)}</div></header>
    <div class="graf alta"><canvas id="c-pmc"></canvas></div>
    <p class="nota">CTL = carga de 42 días, ATL = carga de 7 días, TSB = CTL − ATL del día anterior. El TSS sale de la potencia, del ritmo ajustado a pendiente o de la frecuencia cardiaca, por ese orden.</p>
  </div>
  <div class="rej c2">
    <div class="panel"><header><h3>Horas por semana</h3></header><div class="graf"><canvas id="c-sem"></canvas></div></div>
    <div class="panel"><header><h3>Últimos 28 días</h3><span class="nota">${fH(totRep === 1 ? 0 : totRep)}</span></header>
      <div class="zonas">${Object.keys(GRUPOS).filter(g => reparto[g]).map(g => `<div class="zona" style="grid-template-columns:90px 1fr 80px"><span>${chip(g)}</span><span class="barra"><i style="width:${(reparto[g] / totRep * 100).toFixed(1)}%;background:var(${GRUPOS[g].c})"></i></span><span class="num" style="text-align:right">${fH(reparto[g])}</span></div>`).join("") || `<p class="vacio">Sin actividades en 28 días</p>`}</div>
      <div style="margin-top:16px" class="lista-est">
        <div class="est"><span class="et">Distancia</span><span class="v">${n0(sumar(A, d28, a => a.distance) / 1000)} km</span></div>
        <div class="est"><span class="et">Desnivel</span><span class="v">${n0(sumar(A, d28, desn))} m</span></div>
        <div class="est"><span class="et">TSS</span><span class="v">${n0(sumar(A, d28, a => a.m?.tss))}</span></div>
        <div class="est"><span class="et">Actividades</span><span class="v">${A.filter(a => dia(a.start_date_local) >= d28).length}</span></div>
      </div></div>
  </div>
  <div class="panel"><header><h3>Últimas actividades</h3><a href="#actividades">Ver todas</a></header>
    <div class="tabla-w"><table id="t-ult">${cabTabla}<tbody>${A.slice(0, 8).map(filaAct).join("") || `<tr><td colspan="9" class="vacio">Sin actividades</td></tr>`}</tbody></table></div></div>`;
  clicFilas($("#t-ult"));
  onSeg("pmc-g", v => { S.pmc.grupo = v; chartPMC(); });
  onSeg("pmc-d", v => { S.pmc.dias = +v; chartPMC(); });
  chartPMC();
  chartSemanas();
  pintarHoy();
}
function chartPMC() {
  const p = pmcSerie(S.acts, S.pmc.grupo, S.pmc.dias);
  grafica("c-pmc", {
    data: {
      labels: p.x.map(k => fFechaC(k)),
      datasets: [
        { type: "bar", label: "TSS diario", data: p.tss, backgroundColor: rgba(tok("--muted"), .25), yAxisID: "y2", order: 3 },
        { type: "line", label: "Forma (CTL)", data: p.ctl, borderColor: tok("--ctl"), backgroundColor: rgba(tok("--ctl"), .12), fill: true, pointRadius: 0, borderWidth: 2, tension: .3, order: 1 },
        { type: "line", label: "Fatiga (ATL)", data: p.atl, borderColor: tok("--atl"), pointRadius: 0, borderWidth: 1.5, tension: .3, order: 1 },
        { type: "line", label: "Frescura (TSB)", data: p.tsb, borderColor: tok("--tsb"), pointRadius: 0, borderWidth: 1.5, borderDash: [4, 3], tension: .3, order: 1 },
      ]
    },
    options: {
      interaction: { mode: "index", intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 8, autoSkip: true }, grid: { display: false } }, y: { grid: { color: tok("--line") } }, y2: { position: "right", grid: { display: false }, title: { display: true, text: "TSS" } } },
      plugins: { legend: { position: "bottom" } }
    }
  });
}
function chartSemanas() {
  const semanas = []; let k = lunes(hoyKey());
  for (let i = 0; i < 16; i++) { semanas.unshift(k); k = keyUTC(utc(k) - 7 * 86400000); }
  const idx = new Map(semanas.map((s, i) => [s, i]));
  const ds = {};
  for (const a of S.acts) {
    const w = lunes(dia(a.start_date_local)); if (!idx.has(w)) continue;
    const g = grupo(a); ds[g] = ds[g] || semanas.map(() => 0);
    ds[g][idx.get(w)] += (a.moving_time || 0) / 3600;
  }
  grafica("c-sem", {
    type: "bar",
    data: { labels: semanas.map(fFechaC), datasets: Object.keys(GRUPOS).filter(g => ds[g]).map(g => ({ label: GRUPOS[g].n, data: ds[g].map(v => +v.toFixed(2)), backgroundColor: tok(GRUPOS[g].c), borderRadius: 2 })) },
    options: { scales: { x: { stacked: true, grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { stacked: true, title: { display: true, text: "horas" } } }, plugins: { legend: { position: "bottom" }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fH(c.raw * 3600)}` } } } }
  });
}

  </div>`;
  const pint = () => {
    const q = S.f.q.toLowerCase();

    $("#n-act").textContent = `${n0(L.length)} actividades · ${fH(L.reduce((s, a) => s + (a.moving_time || 0), 0))} · ${n0(L.reduce((s, a) => s + (a.distance || 0), 0) / 1000)} km · ${n0(L.reduce((s, a) => s + desn(a), 0))} m+`;
    $("#t-act tbody").innerHTML = L.slice(0, S.f.lim).map(filaAct).join("") || `<tr><td colspan="9" class="vacio">Ninguna actividad coincide con los filtros</td></tr>`;
    $("#b-mas").hidden = L.length <= S.f.lim;
  };
  $("#f-q").addEventListener("input", e => { S.f.q = e.target.value; S.f.lim = 100; pint(); });
  $("#f-g").addEventListener("change", e => { S.f.grupo = e.target.value; S.f.lim = 100; pint(); });

  clicFilas($("#t-act"));
  pint();
}

/* ------------------------------------------------------------ POTENCIA */
function vPotencia() {
  const el = $("#v-potencia"), aj = S.ajustes;
  const bici = S.acts.filter(a => grupo(a) === "bici" && a.m?.curva_potencia);
  if (!bici.length) { el.innerHTML = `<div class="panel"><p class="vacio">Aún no hay salidas en bici con potenciómetro.</p></div>`; return; }
  const cT = mejorCurva(bici), c365 = mejorCurva(bici, diasAtras(365)), c90 = mejorCurva(bici, diasAtras(90)), c42 = mejorCurva(bici, diasAtras(42));
  const ef = eftp(bici, 42), ef90 = eftp(bici, 90);
  const z = [0, 0, 0, 0, 0, 0, 0]; const d28 = diasAtras(28);
  bici.forEach(a => { if (dia(a.start_date_local) >= d28 && a.m.zonas_potencia) a.m.zonas_potencia.forEach((s, i) => z[i] += s); });
  const kj28 = sumar(bici, d28, a => a.m.kj);
  const pick = [5, 60, 300, 1200, 3600];
  el.innerHTML = `
  <div class="kpis">
    ${kpi("FTP estimado (6 sem.)", ef ? n0(ef) : "–", " W", ef && aj.peso ? `${n2(ef / aj.peso)} W/kg` : "")}
    ${kpi("FTP estimado (90 días)", ef90 ? n0(ef90) : "–", " W", "95 % de 20 min o mejor 60 min")}
    ${kpi("FTP configurado", n0(aj.ftp), " W", aj.peso ? `${n2(aj.ftp / aj.peso)} W/kg · ${n1(aj.peso)} kg` : "")}
    ${kpi("Trabajo 28 días", n0(kj28), " kJ", `${bici.filter(a => dia(a.start_date_local) >= d28).length} salidas con potencia`)}
  </div>
  <div class="panel"><header><h3>Curva de potencia</h3><span class="nota">Máxima potencia media sostenida por duración</span></header>
    <div class="graf alta"><canvas id="c-curva"></canvas></div></div>
  <div class="rej c2">
    <div class="panel"><header><h3>Mejores marcas</h3></header><div class="tabla-w"><table id="t-pr">
      <thead><tr><th>Duración</th><th class="n">Histórico</th><th class="n">W/kg</th><th class="n">Últ. 90 días</th><th>Fecha récord</th></tr></thead>
      <tbody>${DUR.map((d, i) => cT[i] ? `<tr class="clic" data-id="${cT[i].id}"><td>${DUR_ET(d)}</td><td class="n">${n0(cT[i].v)} W</td><td class="n">${aj.peso ? n2(cT[i].v / aj.peso) : "–"}</td><td class="n">${c90[i] ? n0(c90[i].v) + " W" : "–"}</td><td>${fFecha(cT[i].f)}</td></tr>` : "").join("")}</tbody></table></div></div>
    <div class="panel"><header><h3>Zonas de potencia · 28 días</h3><span class="nota">Coggan sobre FTP ${n0(aj.ftp)} W</span></header>${zonasHTML(z, ZP, coloresZP())}</div>
  </div>
  <div class="panel"><header><h3>Evolución mensual</h3><span class="nota">Mejor potencia del mes en duraciones clave</span></header><div class="graf"><canvas id="c-evo"></canvas></div></div>`;
  clicFilas($("#t-pr"));
  const serie = (c, col, lab, dash) => ({ label: lab, data: DUR.map((d, i) => c[i] ? { x: d, y: c[i].v } : null).filter(Boolean), borderColor: col, backgroundColor: col, pointRadius: 0, borderWidth: 2, borderDash: dash || [], tension: .25 });
  grafica("c-curva", {
    type: "line",
    data: { datasets: [serie(cT, tok("--muted"), "Histórico", [5, 4]), serie(c365, tok("--bici"), "Último año"), serie(c90, tok("--accent"), "Últimos 90 días"), serie(c42, tok("--carrera"), "Últimas 6 semanas")] },
    options: { parsing: true, interaction: { mode: "nearest", axis: "x", intersect: false }, scales: { x: ejeLog(""), y: { title: { display: true, text: "W" }, grid: { color: tok("--line") } } }, plugins: { legend: { position: "bottom" }, tooltip: { callbacks: { title: c => DUR_ET(c[0].raw.x), label: c => `${c.dataset.label}: ${n0(c.raw.y)} W${aj.peso ? ` · ${n2(c.raw.y / aj.peso)} W/kg` : ""}` } } } }
  });
  const meses = {};
  bici.forEach(a => { const k = a.start_date_local.slice(0, 7); meses[k] = meses[k] || pick.map(() => 0); pick.forEach((d, j) => { const v = a.m.curva_potencia[DUR.indexOf(d)]; if (v > meses[k][j]) meses[k][j] = v; }); });
  const ks = Object.keys(meses).sort().slice(-24);
  const cols = ["--carrera", "--montana", "--trail", "--bici", "--accent"].map(tok);
  grafica("c-evo", {
    type: "line",
    data: { labels: ks.map(k => new Date(k + "-15").toLocaleDateString("es-ES", { month: "short", year: "2-digit" })), datasets: pick.map((d, j) => ({ label: DUR_ET(d), data: ks.map(k => meses[k][j] || null), borderColor: cols[j], backgroundColor: cols[j], pointRadius: 2, borderWidth: 2, spanGaps: true, tension: .25 })) },
    options: { interaction: { mode: "index", intersect: false }, scales: { x: { grid: { display: false } }, y: { title: { display: true, text: "W" } } }, plugins: { legend: { position: "bottom" } } }
  });
}

/* ------------------------------------------------------------ CARRERA */
function vCarrera() {
  const el = $("#v-carrera");
  const R = S.acts.filter(a => grupo(a) === "carrera" || grupo(a) === "trail");
  if (!R.length) { el.innerHTML = `<div class="panel"><p class="vacio">Aún no hay carreras ni trails.</p></div>`; return; }
  const d28 = diasAtras(28), d365 = diasAtras(365);
  const best = GAP_DUR.map(() => null);
  R.forEach(a => { if (dia(a.start_date_local) < d365) return; (a.m?.mejores_ritmos_gap || []).forEach((v, i) => { if (v && (!best[i] || v < best[i].v)) best[i] = { v, a }; }); });
  const r28 = R.filter(a => dia(a.start_date_local) >= d28);
  const gapMed = r28.filter(a => a.m?.ngp).reduce((s, a) => s + a.m.ngp * a.moving_time, 0) / (r28.filter(a => a.m?.ngp).reduce((s, a) => s + a.moving_time, 0) || 1);
  el.innerHTML = `
  <div class="kpis">
    ${kpi("Distancia 28 días", n0(sumar(R, d28, a => a.distance) / 1000), " km", `${r28.length} salidas · ${fH(sumar(R, d28, a => a.moving_time))}`)}
    ${kpi("Desnivel 28 días", n0(sumar(R, d28, desn)), " m+", "")}
    ${kpi("GAP medio 28 días", gapMed ? fRitmo(1000 / gapMed) : "–", " /km", "ritmo ajustado a la pendiente")}
    ${kpi("Ritmo umbral", fRitmo(S.ajustes.ritmo_umbral), " /km", "configurado en Ajustes")}
  </div>
  <div class="rej c2">
    <div class="panel"><header><h3>Kilómetros por mes</h3></header><div class="graf"><canvas id="c-km"></canvas></div></div>
    <div class="panel"><header><h3>Mejores ritmos GAP · 12 meses</h3></header><div class="tabla-w"><table id="t-gap"><thead><tr><th>Duración</th><th class="n">GAP</th><th>Actividad</th><th>Fecha</th></tr></thead>

  </div>
  <div class="panel"><header><h3>Eficiencia aeróbica</h3><span class="nota">Velocidad ajustada (m/min) por pulsación. Si sube con el tiempo, mejoras.</span></header><div class="graf"><canvas id="c-ef"></canvas></div></div>
  <div class="panel"><header><h3>Últimas carreras</h3></header><div class="tabla-w"><table id="t-run"><thead><tr><th>Fecha</th><th>Nombre</th><th>Tipo</th><th class="n">km</th><th class="n">Tiempo</th><th class="n">Ritmo</th><th class="n">GAP</th><th class="n">m+</th><th class="n">FC</th><th class="n">Desacople</th><th class="n">TSS</th></tr></thead>
    <tbody>${R.slice(0, 15).map(a => `<tr class="clic" data-id="${a.id}"><td>${fFechaC(a.start_date_local)}</td><td class="nom">${esc(a.name)}</td><td>${chip(grupo(a))}</td><td class="n">${fKm(a.distance)}</td><td class="n">${fT(a.moving_time)}</td><td class="n">${fRitmo(a.m?.ritmo)}</td><td class="n">${fRitmo(a.m?.gap)}</td><td class="n">${n0(desn(a))}</td><td class="n">${n0(a.m?.fc_media)}</td><td class="n">${a.m?.desacople != null ? n1(a.m.desacople) + " %" : "–"}</td><td class="n">${n0(a.m?.tss)}</td></tr>`).join("")}</tbody></table></div></div>`;

/* ------------------------------------------------------------ MAPA */
function nuevoMapa(id, el) {
  if (typeof L === "undefined") { el.innerHTML = `<p class="vacio">No se pudo cargar el mapa.</p>`; return null; }
  if (S.mapas[id]) { S.mapas[id].remove(); delete S.mapas[id]; }
  const m = L.map(el, { zoomControl: true, attributionControl: MODO === "local", preferCanvas: true });
  if (MODO === "local") {
    const topo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, attribution: "© OpenStreetMap · OpenTopoMap" });
    const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" });
    topo.addTo(m);
    L.control.layers({ "Topográfico": topo, "Calles": osm }, null, { collapsed: false, position: "topright" }).addTo(m);
  }
  S.mapas[id] = m;
  return m;
}
function vMapa() {
  const el = $("#v-mapa");

  el.innerHTML = `<div class="panel"><header><h3>Todas tus rutas</h3><div class="filtros">
    ${seg("m-g", [["todos", "Todo"], ["bici", "Bici"], ["carrera", "Carrera"], ["trail", "Trail"], ["montana", "Montaña"]], S.mapaF.grupo)}

    <div class="mapa grande" id="mapa-todo"></div>
    <p class="nota" id="m-nota"></p></div>`;
  const pint = () => {
    const m = nuevoMapa("todo", $("#mapa-todo")); if (!m) return;
    const capa = []; let n = 0;
    for (const a of S.acts) {
      if (!enGrupo(a, S.mapaF.grupo)) continue;

    $("#m-nota").textContent = `${n0(n)} rutas. Pulsa una para ver la actividad.${MODO === "web" ? " Aquí las rutas se dibujan sin mapa de fondo; en la app local se ven sobre el mapa topográfico." : ""}`;
  };
  onSeg("m-g", v => { S.mapaF.grupo = v; pint(); });
  $("#m-a").addEventListener("change", e => { S.mapaF.anio = e.target.value; pint(); });
  requestAnimationFrame(pint);
}

function sumarDias(k, n) { return keyUTC(utc(k) + n * 86400000); }

async function planDe(l) {
  if (MODO === "local") {
    try { const r = await api("/api/plan?lunes=" + l); S.planCfg = r.cfg; return r.plan; } catch (_) { return null; }
  }
  if (S.demo) return planDemo(l);
  return (S.planes || {})[l] || null;
}
function planDemo(l) {
  const base = window.PLAN_DEMO; if (!base) return null;
  const off = Math.round((utc(l) - utc(base.lunes)) / 86400000);

      S.estado = await api("/api/estado"); p.dataset.paso = ""; pintarConexion();
    });
    return;
  }
  if (!e.conectado) {
    if (p.dataset.paso === "2") return;
    p.dataset.paso = "2";
    p.innerHTML = `<header><h3>Paso 2 · Autoriza el acceso</h3></header>
      <p style="margin-top:0">Strava te pedirá permiso para leer tus actividades (también las privadas). Después la app descargará todo tu historial.</p>
      ${e.modo_archivo ? `<p class="nota">Al aceptar, Strava te llevará a una página que <b>no carga</b> (dirección que empieza por <code>http://localhost/entrenos?…code=</code>). Es normal: copia esa dirección completa, vuelve aquí y pégala abajo.</p>
      <div class="filtros" style="margin-bottom:12px"><label class="campo"><span>Dirección de la página de Strava</span><input id="cod-url" placeholder="http://localhost/entrenos?state=entrenos&code=…"></label><button class="btn prim" type="button" id="b-cod">Terminar conexión</button></div><p class="nota" id="msg-cod"></p>` : ""}
      <div style="display:flex;gap:12px;flex-wrap:wrap">${e.red?.servidor || e.red?.es_local ? `<a class="btn prim" href="/conectar">Conectar con Strava</a>` : `<span class="nota">Conecta Strava desde el PC donde está instalada la app.</span>`}<button class="btn" id="b-reset" type="button">Cambiar ID y secreto</button></div>`;
    $("#b-cod")?.addEventListener("click", async () => {
      try { await api("/api/codigo", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: $("#cod-url").value }) }); S.estado = await api("/api/estado"); p.dataset.paso = ""; pintarConexion(); }
      catch (err) { $("#msg-cod").textContent = "No se pudo conectar: " + err.message; }
    });
    $("#b-reset").addEventListener("click", async () => { await api("/api/config_strava", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); S.estado = await api("/api/estado"); p.dataset.paso = ""; pintarConexion(); });
    return;
  }
  const s = e.sync, at = e.atleta || {};
  const pct = s.total ? Math.round(s.progreso / s.total * 100) : (s.activo ? 5 : 100);
  const html = `<header><h3>Strava</h3><span class="pill bien">Conectado${at.firstname ? " · " + esc(at.firstname + " " + (at.lastname || "")) : ""}</span></header>
    <div class="lista-est">
      <div class="est"><span class="et">Actividades</span><span class="v">${n0(e.recuento.total)}</span></div>
      <div class="est"><span class="et">Pendientes de detalle</span><span class="v">${n0(e.recuento.pendientes_streams)}</span></div>
      <div class="est"><span class="et">Última sincronización</span><span class="v">${s.ultima ? fechaD(s.ultima).toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "–"}</span></div>
      <div class="est"><span class="et">Uso de la API (15 min · día)</span><span class="v">${e.uso_api ? esc(e.uso_api.uso.replace(",", " · ")) + " de " + esc(e.uso_api.limite.replace(",", " · ")) : "–"}</span></div>
    </div>
    <div style="margin-top:14px;display:grid;gap:6px"><div class="barra-prog"><i style="width:${pct}%"></i></div><span class="nota">${esc(s.mensaje || "Sin actividad")}</span></div>
    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
      <button class="btn prim" data-acc="sync" type="button" ${s.activo ? "disabled" : ""}>Sincronizar ahora</button>
      <button class="btn" data-acc="completa" type="button" ${s.activo ? "disabled" : ""}>Revisar todo el historial</button>
      <button class="btn" data-acc="parar" type="button" ${s.activo ? "" : "disabled"}>Parar</button>
    </div>
    <div class="auto-sync">
      <div><b>Sincronización automática</b><span class="nota">Cada ${e.auto.intervalo_min} min, en segundo plano${e.auto.proxima ? ` · próxima a las ${fechaD(e.auto.proxima).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" })}` : ""}. Las actividades nuevas de Strava aparecen solas y el plan se reajusta.</span></div>
      ${e.auto.arranque_soportado && e.red?.es_local ? `<label class="interruptor"><input type="checkbox" id="chk-auto" ${e.auto.arranque_activo ? "checked" : ""}><span>Arrancar con Windows</span></label>` : `<span class="nota">Arranque automático disponible solo en Windows.</span>`}
    </div>
    <p class="nota">Con «Arrancar con Windows» la app se abre sola, sin ventanas, al encender el PC y recoge lo que hayas subido a Strava mientras estaba apagado. Strava permite unas 100 peticiones cada 15 min y 1000 al día: la primera descarga de un historial largo puede tardar horas.</p>
    ${e.red?.es_local && !e.red?.navegador ? `<div style="display:flex;justify-content:flex-end"><button class="btn" type="button" id="b-salir">Cerrar la app</button></div>` : ""}`;
  p.dataset.paso = "3";
  p.innerHTML = html;
  $("#chk-auto")?.addEventListener("change", async ev => {
    try { await api("/api/autoarranque", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ activo: ev.target.checked }) }); } catch (_) { ev.target.checked = !ev.target.checked; }
  });
  $("#b-salir")?.addEventListener("click", async () => {
    try { await api("/api/salir", { method: "POST" }); } catch (_) { }
    p.innerHTML = `<p class="vacio">App cerrada. Para volver a abrirla usa iniciar.bat${S.estado?.auto?.arranque_activo ? " o reinicia el PC" : ""}.</p>`;
  });
  p.querySelectorAll("button[data-acc]").forEach(b => b.addEventListener("click", async () => {
    const acc = b.dataset.acc;
    if (acc === "parar") await api("/api/sync/parar", { method: "POST" });
    else await api("/api/sync", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ completa: acc === "completa" }) });
    S.estado = await api("/api/estado"); pintarSync(); pintarConexion();
  }));
}
async function guardarAjustes() {
  const d = {};
  CAMPOS_AJ.forEach(([k]) => { d[k] = $("#aj-" + k).value; });
  d.sexo = $("#aj-sexo").value;
  const rm = String(d.ritmo_umbral).match(/^(\d+):(\d{1,2})$/);
  d.ritmo_umbral = rm ? (+rm[1]) * 60 + (+rm[2]) : +d.ritmo_umbral;
  if (!d.ritmo_umbral) { $("#msg-aj").textContent = "Escribe el ritmo umbral como min:ss, por ejemplo 4:30."; return; }
  await api("/api/ajustes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
  $("#msg-aj").textContent = "Guardado. Recalculando métricas…";
}

$("#f-import").addEventListener("change", e => { const f = e.target.files[0]; if (f) importar(f); e.target.value = ""; });

/* ------------------------------------------------------------ inicio */
dibujarTopo();
mostrar();
if (MODO === "local") cargarLocal(); else cargarWeb();
})();

</script>
</body></html>
